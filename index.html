<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>國環院 PA 問答集｜環境檢驗室品管指引查詢系統</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Google Fonts (Noto Sans TC) -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #f4f7f6;
            -webkit-tap-highlight-color: transparent;
        }
        /* 隱藏滾動條但保留滾動功能 (適合手機橫向標籤列) */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        /* 關鍵字高亮樣式 */
        mark.highlight {
            background-color: #fef08a;
            color: #854d0e;
            padding: 0 2px;
            border-radius: 4px;
            font-weight: 700;
        }
        /* 智慧解答卡片進場動畫 */
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-slide-down {
            animation: slideDown 0.25s ease-out forwards;
        }
    </style>
</head>
<body class="text-slate-800 flex flex-col min-h-screen pb-36">

    <!-- 頂部固定導覽列與分類索引 -->
    <header class="sticky top-0 z-30 bg-emerald-800 text-white shadow-md">
        <div class="max-w-3xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-2.5">
                <div class="bg-emerald-600 p-2 rounded-xl shadow-inner flex items-center justify-center">
                    <!-- 實驗室燒杯圖示 -->
                    <svg class="w-6 h-6 text-emerald-100" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"></path>
                    </svg>
                </div>
                <div>
                    <h1 class="text-lg font-bold tracking-wide leading-tight">國環院 PA 問答集</h1>
                    <p class="text-xs text-emerald-200">環境檢驗室品質管制指引隨身查</p>
                </div>
            </div>
            <!-- 管理題庫按鈕 (符合 1A 需求) -->
            <button onclick="openAdminModal()" class="bg-emerald-700 hover:bg-emerald-600 active:scale-95 transition px-3 py-2 rounded-xl text-xs font-medium flex items-center space-x-1.5 border border-emerald-500/40 shadow-sm">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path>
                </svg>
                <span>管理題庫</span>
            </button>
        </div>

        <!-- 上方：問題的分類索引列 (可左右滑動，適合手機單手點選) -->
        <div class="bg-emerald-900/90 border-t border-emerald-700/60">
            <div class="max-w-3xl mx-auto px-3 py-2.5">
                <div class="flex items-center justify-between mb-1.5 px-1">
                    <span class="text-xs font-medium text-emerald-200 flex items-center">
                        <svg class="w-3.5 h-3.5 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h7"></path>
                        </svg>
                        上方問題索引（點選切換章節）：
                    </span>
                    <span id="totalCountBadge" class="text-xs bg-emerald-800 text-emerald-200 px-2 py-0.5 rounded-full">共 0 題</span>
                </div>
                <div id="categoryTabs" class="flex space-x-2 overflow-x-auto no-scrollbar pb-0.5">
                    <!-- 由 JavaScript 動態產生 PA 分類按鈕 -->
                </div>
            </div>
        </div>
    </header>

    <!-- 中間主要內容區 -->
    <main class="flex-1 max-w-3xl w-full mx-auto px-4 pt-4">
        
        <!-- 智慧問答置頂回覆卡 (當使用者在下方提問時顯示) -->
        <div id="smartAnswerBox" class="hidden mb-5 bg-gradient-to-br from-amber-50 to-orange-50 border-2 border-amber-400 rounded-2xl p-4 shadow-md animate-slide-down">
            <div class="flex items-start justify-between">
                <div class="flex items-center space-x-2">
                    <span class="bg-amber-500 text-white text-xs font-bold px-2.5 py-1 rounded-lg flex items-center">
                        <svg class="w-3.5 h-3.5 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                        </svg>
                        PA 智慧解析回覆
                    </span>
                    <span id="smartAnswerQuery" class="text-xs text-amber-900 font-medium truncate max-w-[180px] sm:max-w-xs"></span>
                </div>
                <button onclick="clearSearch()" class="text-amber-700 hover:text-amber-900 bg-amber-200/60 hover:bg-amber-200 rounded-lg px-2 py-1 text-xs font-medium transition">
                    清除提問
                </button>
            </div>
            <div id="smartAnswerContent" class="mt-3 text-sm text-slate-800 leading-relaxed space-y-2">
                <!-- 動態智慧解析內容 -->
            </div>
        </div>

        <!-- 熱門快速提問標籤 (方便實驗室人員不用打字直接點) -->
        <div class="mb-4">
            <div class="text-xs font-medium text-slate-500 mb-2 flex items-center">
                <span>💡 實驗室常問快選（點擊直接測試問答）：</span>
            </div>
            <div class="flex flex-wrap gap-2">
                <button onclick="quickAsk('QC連續六點同一側')" class="text-xs bg-white hover:bg-emerald-50 text-emerald-800 border border-emerald-200 px-3 py-1.5 rounded-full shadow-sm active:scale-95 transition font-medium">
                    🔥 QC連續六點同一側
                </button>
                <button onclick="quickAsk('檢量線相關係數 r 值標準')" class="text-xs bg-white hover:bg-emerald-50 text-emerald-800 border border-emerald-200 px-3 py-1.5 rounded-full shadow-sm active:scale-95 transition font-medium">
                    📈 檢量線 r 值標準
                </button>
                <button onclick="quickAsk('查核樣品 QCS 頻率')" class="text-xs bg-white hover:bg-emerald-50 text-emerald-800 border border-emerald-200 px-3 py-1.5 rounded-full shadow-sm active:scale-95 transition font-medium">
                    🧪 查核樣品分析頻率
                </button>
                <button onclick="quickAsk('MDL 7次重複分析')" class="text-xs bg-white hover:bg-emerald-50 text-emerald-800 border border-emerald-200 px-3 py-1.5 rounded-full shadow-sm active:scale-95 transition font-medium">
                    🔍 MDL 怎麼做
                </button>
                <button onclick="quickAsk('冷藏保存溫度 4度')" class="text-xs bg-white hover:bg-emerald-50 text-emerald-800 border border-emerald-200 px-3 py-1.5 rounded-full shadow-sm active:scale-95 transition font-medium">
                    ❄️ 樣品保存 4±2℃
                </button>
            </div>
        </div>

        <!-- 目前顯示狀態列 -->
        <div class="flex items-center justify-between mb-3 px-1">
            <h2 id="currentCategoryTitle" class="text-base font-bold text-slate-700">全部 PA 問答索引</h2>
            <button onclick="toggleAllAccordions()" id="toggleAllBtn" class="text-xs text-emerald-700 hover:text-emerald-900 font-medium underline">
                全部展開
            </button>
        </div>

        <!-- 問答清單容器 -->
        <div id="qaListContainer" class="space-y-3">
            <!-- 由 JavaScript 動態渲染 QA 卡片 -->
        </div>

    </main>

    <!-- 下方固定：Key in 提出的問題互動區 (符合使用者要求 2：下方設計 key in 提出的問題) -->
    <footer class="fixed bottom-0 left-0 right-0 z-30 bg-white/95 backdrop-blur-md border-t border-slate-200 shadow-[0_-4px_20px_-5px_rgba(0,0,0,0.1)]">
        <div class="max-w-3xl mx-auto px-4 py-3">
            <form id="questionForm" onsubmit="handleAskSubmit(event)" class="relative flex items-center gap-2">
                <div class="relative flex-1">
                    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-emerald-600">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"></path>
                        </svg>
                    </div>
                    <input 
                        type="text" 
                        id="questionInput" 
                        placeholder="請在此 Key in 您的 PA 品管問題（例：QC連續六點同一側）..." 
                        class="w-full pl-10 pr-9 py-3 bg-slate-100 focus:bg-white border-2 border-slate-200 focus:border-emerald-600 rounded-2xl text-sm md:text-base text-slate-800 placeholder-slate-400 focus:outline-none transition"
                        oninput="handleRealtimeInput(this.value)"
                    >
                    <!-- 清除輸入框按鈕 -->
                    <button 
                        type="button" 
                        id="clearInputBtn"
                        onclick="clearSearch()" 
                        class="hidden absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-600"
                    >
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                        </svg>
                    </button>
                </div>
                <button 
                    type="submit" 
                    class="bg-emerald-700 hover:bg-emerald-800 active:scale-95 text-white font-bold px-5 py-3 rounded-2xl text-sm md:text-base shadow-md transition flex items-center shrink-0"
                >
                    <span>提問解答</span>
                </button>
            </form>
        </div>
    </footer>

    <!-- 管理題庫與匯出入 Modal (符合 1A：直接在網頁新增/匯入匯出) -->
    <div id="adminModal" class="fixed inset-0 z-50 hidden bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 overflow-y-auto">
        <div class="bg-white rounded-3xl max-w-lg w-full p-5 md:p-6 shadow-2xl border border-slate-100 my-8 max-h-[90vh] overflow-y-auto">
            <div class="flex items-center justify-between border-b border-slate-100 pb-3 mb-4">
                <h3 class="text-lg font-bold text-slate-800 flex items-center">
                    <span class="bg-emerald-100 text-emerald-800 p-1.5 rounded-lg mr-2">⚙️</span>
                    管理 PA 問答題庫（免寫程式）
                </h3>
                <button onclick="closeAdminModal()" class="text-slate-400 hover:text-slate-600 p-1">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>

            <!-- 新增單筆問答表單 -->
            <form id="addQaForm" onsubmit="handleAddQa(event)" class="space-y-3.5">
                <div class="bg-emerald-50/70 border border-emerald-200/80 rounded-2xl p-3 text-xs text-emerald-900 leading-relaxed">
                    💡 您可以在此直接新增實驗室內部常見的稽核問答。新增後可點選下方「匯出 Excel (CSV)」備份保存。
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">所屬 PA 指引分類 *</label>
                    <select id="newQaCategory" required class="w-full px-3 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm focus:outline-none focus:border-emerald-600">
                        <option value="PA101">PA101 品管系統通則</option>
                        <option value="PA102">PA102 樣品採集與保存</option>
                        <option value="PA103">PA103 檢量線製備與查核</option>
                        <option value="PA104">PA104 品管樣品分析</option>
                        <option value="PA105" selected>PA105 品質管制圖</option>
                        <option value="PA107">PA107 方法偵測極限 (MDL)</option>
                        <option value="PA108">PA108 儀器設備校正與維護</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">問題標題 (Q) *</label>
                    <input type="text" id="newQaQuestion" required placeholder="例如：品質管制圖連續6點在同一側算失控嗎？" class="w-full px-3 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm focus:outline-none focus:border-emerald-600">
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">根據國環院 PA 的解答內容 (A) *</label>
                    <textarea id="newQaAnswer" required rows="4" placeholder="請輸入對應的法規條文說明與判定標準..." class="w-full px-3 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm focus:outline-none focus:border-emerald-600"></textarea>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">法規條文依據 (選填)</label>
                        <input type="text" id="newQaRef" placeholder="例：NIEA-PA105 表三" class="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-xl text-sm focus:outline-none focus:border-emerald-600">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">搜尋同義關鍵字 (以逗號分隔)</label>
                        <input type="text" id="newQaKeywords" placeholder="例：QC,六點,6點,七點,同一側" class="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-xl text-sm focus:outline-none focus:border-emerald-600">
                    </div>
                </div>

                <button type="submit" class="w-full bg-emerald-700 hover:bg-emerald-800 text-white font-bold py-3 rounded-xl text-sm shadow transition">
                    ＋ 立即新增至題庫
                </button>
            </form>

            <!-- 匯出與匯入 CSV 區塊 -->
            <div class="mt-6 pt-4 border-t border-slate-200">
                <h4 class="text-xs font-bold text-slate-600 mb-2.5">📊 Excel (CSV) 批次匯出與匯入</h4>
                <div class="grid grid-cols-2 gap-2.5">
                    <button onclick="exportCSV()" class="flex items-center justify-center space-x-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium py-2.5 px-3 rounded-xl text-xs transition border border-slate-300">
                        <svg class="w-4 h-4 text-emerald-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
                        </svg>
                        <span>匯出題庫 CSV</span>
                    </button>
                    <label class="flex items-center justify-center space-x-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium py-2.5 px-3 rounded-xl text-xs transition border border-slate-300 cursor-pointer">
                        <svg class="w-4 h-4 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path>
                        </svg>
                        <span>匯入 CSV 檔案</span>
                        <input type="file" accept=".csv" class="hidden" onchange="importCSV(event)">
                    </label>
                </div>
            </div>
        </div>
    </div>

    <!-- 頂部輕量提示通知 (取代 alert) -->
    <div id="toastMsg" class="fixed top-16 left-1/2 -translate-x-1/2 z-50 hidden bg-slate-900 text-white text-xs font-medium px-4 py-2.5 rounded-full shadow-lg"></div>

    <script>
        // ==========================================
        // 1. 國環院 PA 分類定義
        // ==========================================
        const PA_CATEGORIES = [
            { id: 'ALL', code: '全部', name: '全部 PA 問答索引' },
            { id: 'PA101', code: 'PA101', name: 'PA101 環境檢驗室品質管制系統通則' },
            { id: 'PA102', code: 'PA102', name: 'PA102 樣品採集及保存品質管制指引' },
            { id: 'PA103', code: 'PA103', name: 'PA103 檢量線製備及查核指引' },
            { id: 'PA104', code: 'PA104', name: 'PA104 品管樣品分析指引' },
            { id: 'PA105', code: 'PA105', name: 'PA105 品質管制圖建立及運用指引' },
            { id: 'PA107', code: 'PA107', name: 'PA107 方法偵測極限 (MDL) 測定指引' },
            { id: 'PA108', code: 'PA108', name: 'PA108 儀器及設備校正與維護指引' }
        ];

        // ==========================================
        // 2. 內建國環院 PA 精選題庫資料
        // ==========================================
        let qaDatabase = [
            {
                id: 1,
                category: 'PA105',
                question: 'QC 品質管制圖若出現「連續六點落在中心線同一側」，算不算失控（異常）？',
                answer: `依據國環院 NIEA-PA105（品質管制圖建立指引）規範，請特別區分「同一側」與「趨勢」的點數差異：
1. 【中心線同一側】：官方失控準則為「連續 7 點」落在中心線（平均值 CL）同一側。因此若僅「連續 6 點在同一側」，法規上尚未達失控標準，但已屬系統性偏移（Bias）的強烈預警，建議檢測人員提前檢查標準品、試劑或儀器狀態。
2. 【需要以 6 點判定的情況】：若為「連續 6 點持續上升或持續下降（趨勢 Trend）」，則立即構成失控，必須採取矯正措施！`,
                ref: 'NIEA-PA105 品質管制圖失控研判準則',
                keywords: ['QC', '連續六點', '連續6點', '連續七點', '連續7點', '同一側', '同側', '管制圖', '失控', '異常', '上升', '下降', '趨勢']
            },
            {
                id: 2,
                category: 'PA105',
                question: '品質管制圖（QC Chart）需要累積多少筆數據才能建立？管制界限怎麼算？',
                answer: `1. 【數據筆數】：應至少收集 15 至 20 組以上（通常建議 20 組）不同批次的品管分析數據（如查核樣品回收率 P% 或重複分析 RPD）。
2. 【計算方式】：計算平均值（X̄，中心線 CL）與標準偏差（S）：
   • 警告上限/下限（UWL / LWL）：X̄ ± 2S
   • 管制上限/下限（UCL / LCL）：X̄ ± 3S`,
                ref: 'NIEA-PA105 第四節 品質管制圖之建立',
                keywords: ['管制圖', '幾點', '20點', '15點', '標準差', '2S', '3S', '警告限', '管制限', 'UCL', 'UWL']
            },
            {
                id: 3,
                category: 'PA105',
                question: '品質管制圖有哪些情況必須判定為「失控（Out of Control）」並停機檢討？',
                answer: `當品管數據出現以下任一情形時，即判定為失控，應立即暫停分析、查明原因並執行矯正措施：
1. 有 1 點超出管制界限（±3S）。
2. 連續 3 點中有 2 點超出警告界限（±2S）。
3. 連續 7 點落在中心線（CL）同一側。
4. 連續 6 點呈現持續上升或持續下降之趨勢。`,
                ref: 'NIEA-PA105 品質管制圖之運用與研判',
                keywords: ['失控', '超出', '3S', '2S', '連續3點', '連續7點', '連續6點', '停機', '矯正']
            },
            {
                id: 4,
                category: 'PA101',
                question: '環境檢驗室每批次樣品分析，基本需要執行哪些例行品管樣品（QC）？',
                answer: `依 NIEA-PA101 與 PA104 規定，每一分析批次（最多不超過 20 個樣品）通常應包含：
1. 方法空白樣品（MB）：至少 1 個，確認前處理及試劑無污染。
2. 查核樣品（QCS / LCS）：至少 1 個，確認分析系統準確度。
3. 重複樣品（DUP）：至少 1 個，確認分析精密度。
4. 添加樣品（MS / MSD）：至少 1 個，評估樣品基質干擾情形。`,

        // 智慧搜尋與相關度計分邏輯 (支援自然語言提問如「QC連續六點同一側」)
        function scoreQaItem(item, query) {
            if (!query || !query.trim()) return 1;
            const cleanQuery = query.trim().toLowerCase();

            // 同義詞與數詞轉換輔助 (將「六」與「6」、「七」與「7」互通比對)
            const normalizedQuery = cleanQuery
                .replace(/六/g, '6')
                .replace(/七/g, '7')
                .replace(/三/g, '3')
                .replace(/五/g, '5')
                .replace(/四/g, '4');

            const fullText = `${item.category} ${item.question} ${item.answer} ${item.ref} ${(item.keywords || []).join(' ')}`
                .toLowerCase()
                .replace(/六/g, '6')
                .replace(/七/g, '7')
                .replace(/三/g, '3')
                .replace(/五/g, '5')
                .replace(/四/g, '4');

            let score = 0;

            // 1. 完整字串命中
            if (fullText.includes(normalizedQuery)) {
                score += 50;
            }

            // 2. 預設關鍵字陣列命中
            (item.keywords || []).forEach(kw => {
                const normKw = kw.toLowerCase().replace(/六/g, '6').replace(/七/g, '7');
                if (normalizedQuery.includes(normKw) || normKw.includes(normalizedQuery)) {
                    score += 25;
                }
            });

            // 3. 雙字元切詞模糊比對 (處理整句話提問，如「QC連續六點同一側」)
            if (normalizedQuery.length >= 2) {
                for (let i = 0; i < normalizedQuery.length - 1; i++) {
                    const biGram = normalizedQuery.substring(i, i + 2).trim();
                    if (biGram.length === 2 && fullText.includes(biGram)) {
                        score += 8;
                    }
                }
            }

            return score;
        }

        // 關鍵字高亮處理
        function highlightText(text, query) {
            if (!query || !query.trim()) return escapeHtml(text);
            let safeText = escapeHtml(text);
            const cleanQuery = query.trim();

            // 擷取查詢句中的重點詞彙進行高亮
            const tokens = new Set([cleanQuery]);
            ['QC', '連續', '六點', '6點', '7點', '同一側', '失控', '管制圖', '檢量線', 'MDL', '查核', '保存', '溫度'].forEach(t => {
                if (cleanQuery.toUpperCase().includes(t) || (t === '6點' && cleanQuery.includes('六點'))) {
                    tokens.add(t);
                }
            });

            tokens.forEach(token => {
                if (token.length >= 2) {
                    const reg = new RegExp(`(${escapeRegExp(token)})`, 'gi');
                    safeText = safeText.replace(reg, '<mark class="highlight">$1</mark>');
                }
            });
            return safeText;
        }

        // 匯出 CSV (加上 UTF-8 BOM 確保 Excel 打開繁體中文不亂碼)
        function exportCSV() {
            const headers = ['分類(PA)', '問題(Question)', '解答(Answer)', '法規依據(Ref)', '關鍵字(Keywords)'];
            const rows = qaDatabase.map(item => [
                item.category,
                item.question,
                item.answer,
                item.ref || '',
                (item.keywords || []).join(',')
            ]);

            const csvContent = '\uFEFF' + [headers, ...rows]
                .map(row => row.map(cell => `"${String(cell).replace(/"/g, '""')}"`).join(','))
                .join('\r\n');

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `國環院PA問答集題庫_${new Date().toISOString().slice(0,10)}.csv`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            showToast('已匯出 CSV 檔案（可用 Excel 開啟編輯）');
        }

        function importCSV(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const text = e.target.result;
                    const parsedRows = parseCSVText(text);
                    if (parsedRows.length <= 1) {
                        showToast('CSV 檔案內容為空或格式不符');
                        return;
                    }

                    let addedCount = 0;
                    // 略過第一列標題列
                    for (let i = 1; i < parsedRows.length; i++) {
                        const row = parsedRows[i];
                        if (row.length >= 3 && row[1].trim() && row[2].trim()) {
                            const newId = qaDatabase.length > 0 ? Math.max(...qaDatabase.map(x => x.id)) + 1 : 1;
                            qaDatabase.push({
                                id: newId,
                                category: row[0].trim() || 'PA101',
                                question: row[1].trim(),
                                answer: row[2].trim(),
                                ref: (row[3] || '').trim() || '國環院 PA 指引',
                                keywords: (row[4] || '').split(/[,，、\s]+/).filter(Boolean)
                            });
                            addedCount++;
                        }
                    }

                    renderCategoryTabs();
                    renderQaList();
                    closeAdminModal();
                    showToast(`成功匯入 ${addedCount} 筆 PA 問答！`);
                } catch (err) {
                    showToast('讀取 CSV 失敗，請確認檔案格式');
                }
            };
            reader.readAsText(file, 'UTF-8');
        }

        // 簡易支援引號換行的 CSV 解析器
        function parseCSVText(text) {
            const result = [];
            let row = [];
            let current = '';
            let inQuotes = false;

            for (let i = 0; i < text.length; i++) {
                const char = text[i];
                const nextChar = text[i + 1];

                if (inQuotes) {
                    if (char === '"' && nextChar === '"') {
                        current += '"';
                        i++;
                    } else if (char === '"') {
                        inQuotes = false;
                    } else {
                        current += char;
                    }
                } else {
                    if (char === '"') {
                        inQuotes = true;
                    } else if (char === ',') {
                        row.push(current);
                        current = '';
                    } else if (char === '\r' && nextChar === '\n') {
                        row.push(current);
                        result.push(row);
                        row = [];
                        current = '';
                        i++;
                    } else if (char === '\n') {
                        row.push(current);
                        result.push(row);
                        row = [];
                        current = '';
                    } else {
                        current += char;
                    }
                }
            }
            if (current || row.length > 0) {
                row.push(current);
                result.push(row);
            }
            return result;
        }

        // ==========================================
        // 6. 工具輔助函式
        // ==========================================
        function showToast(msg) {
            const toast = document.getElementById('toastMsg');
            toast.textContent = msg;
            toast.classList.remove('hidden');
            setTimeout(() => {
                toast.classList.add('hidden');
            }, 2600);
        }

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function escapeRegExp(str) {
            return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        }
    </script>
</body>
